<!DOCTYPE html>
<html lang="en" class="h-full w-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Guessper</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a; /* Slate 900 */
            overflow-x: hidden;
            margin: 0;
        }

        /* Animated Background Blobs */
        .blob-container {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            overflow: hidden;
            z-index: -1;
            background: #0f172a;
        }

        .blob {
            position: absolute;
            filter: blur(80px);
            opacity: 0.6;
            animation: float 20s infinite alternate cubic-bezier(0.4, 0, 0.2, 1);
        }

        .blob-1 {
            top: -10%; left: -10%;
            width: 50vw; height: 50vw;
            background: #4f46e5; /* Indigo */
            animation-duration: 25s;
        }

        .blob-2 {
            bottom: -20%; right: -10%;
            width: 60vw; height: 60vw;
            background: #ec4899; /* Pink */
            animation-duration: 22s;
            animation-direction: alternate-reverse;
        }

        .blob-3 {
            top: 30%; left: 40%;
            width: 40vw; height: 40vw;
            background: #9333ea; /* Purple */
            animation-duration: 28s;
            animation-delay: -5s;
        }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(10vw, -15vh) scale(1.1); }
            66% { transform: translate(-15vw, 10vh) scale(0.9); }
            100% { transform: translate(5vw, 20vh) scale(1.2); }
        }

        /* Glassmorphism Panel */
        .glass-panel {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .glass-button {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.2s;
        }
        .glass-button:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.3);
        }

        /* Custom Slider (Thick & Premium) */
        input[type=range] {
            -webkit-appearance: none; 
            width: 100%; 
            background: transparent; 
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 40px;
            width: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #a855f7 0%, #ec4899 100%);
            cursor: pointer;
            margin-top: -12px; 
            box-shadow: 0 0 20px rgba(236, 72, 153, 0.6);
            border: 4px solid #fff;
            transition: transform 0.1s;
        }

        input[type=range]::-webkit-slider-thumb:active {
            transform: scale(1.15);
        }

        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 16px;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 9999px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Animations */
        .fade-in { animation: fadeIn 0.5s ease-out forwards; }
        .slide-up { animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .pop-in { animation: popIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes popIn {
            0% { opacity: 0; transform: scale(0.9); }
            70% { transform: scale(1.05); }
            100% { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body class="text-white flex items-center justify-center min-h-screen p-4 selection:bg-purple-500/50">

    <!-- Animated Background -->
    <div class="blob-container">
        <div class="blob blob-1 rounded-full"></div>
        <div class="blob blob-2 rounded-full"></div>
        <div class="blob blob-3 rounded-full"></div>
    </div>

    <!-- MAIN MENU SCREEN -->
    <div id="start-screen" class="glass-panel max-w-md w-full rounded-[2.5rem] p-8 text-center pop-in relative z-10">
        <div class="text-6xl mb-4 drop-shadow-lg">🔮</div>
        <h1 class="text-5xl font-black text-transparent bg-clip-text bg-gradient-to-r from-indigo-300 via-purple-300 to-pink-300 mb-3 leading-tight tracking-tight drop-shadow-sm">
            Guessper
        </h1>
        <p class="text-slate-300 mb-8 font-semibold text-lg">
            A guess from 0 to 100.<br>How accurate can you be?
        </p>
        
        <button onclick="startGame(0)" class="w-full bg-gradient-to-r from-indigo-500 via-purple-500 to-pink-500 hover:from-indigo-400 hover:via-purple-400 hover:to-pink-400 text-white font-black py-5 rounded-2xl text-xl shadow-[0_0_30px_rgba(168,85,247,0.4)] transition-all active:scale-95 mb-8 border border-white/20">
            ▶ Play Today
        </button>

        <div class="border-t border-white/10 pt-6">
            <h3 class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-4">Past Games</h3>
            <div class="grid grid-cols-2 gap-3">
                <button onclick="startGame(1)" class="glass-button text-slate-200 font-bold py-3 px-4 rounded-xl active:scale-95">Yesterday</button>
                <button onclick="startGame(2)" class="glass-button text-slate-200 font-bold py-3 px-4 rounded-xl active:scale-95">2 Days Ago</button>
                <button onclick="startGame(3)" class="glass-button text-slate-200 font-bold py-3 px-4 rounded-xl active:scale-95">3 Days Ago</button>
                <button onclick="startGame(4)" class="glass-button text-slate-200 font-bold py-3 px-4 rounded-xl active:scale-95">4 Days Ago</button>
                <button onclick="startGame(5)" class="col-span-2 glass-button text-slate-200 font-bold py-3 px-4 rounded-xl active:scale-95">5 Days Ago</button>
            </div>
        </div>
    </div>

    <!-- GAME SCREEN -->
    <div id="game-screen" class="hidden glass-panel max-w-lg w-full rounded-[2.5rem] overflow-hidden relative z-10 flex flex-col h-[90vh] max-h-[800px]">
        
        <!-- Header -->
        <div class="bg-black/20 border-b border-white/10 p-6 flex justify-between items-center backdrop-blur-md">
            <div>
                <span class="text-[10px] font-bold text-indigo-300 uppercase tracking-widest block">Question</span>
                <span class="text-xl font-black text-white" id="round-indicator">1/5</span>
            </div>
            <div class="text-center bg-white/10 px-4 py-1.5 rounded-full border border-white/10">
                <span class="text-sm font-bold text-slate-200" id="game-title-display">Today</span>
            </div>
            <div class="text-right">
                <span class="text-[10px] font-bold text-pink-300 uppercase tracking-widest block">Score</span>
                <span class="text-xl font-black text-white" id="score-indicator">0</span>
            </div>
        </div>

        <!-- Question Area (Flex grow to push feedback to bottom if needed) -->
        <div class="p-6 md:p-8 flex-1 flex flex-col justify-center relative">
            <h2 id="question-text" class="text-2xl md:text-3xl font-black text-white mb-10 text-center leading-snug drop-shadow-md">
                Loading...
            </h2>

            <!-- Live Value Display -->
            <div class="text-center mb-6">
                <span id="slider-value-display" class="text-8xl font-black text-transparent bg-clip-text bg-gradient-to-br from-indigo-200 via-purple-200 to-pink-200 tracking-tighter drop-shadow-lg" style="text-shadow: 0 4px 20px rgba(255,255,255,0.2);">
                    50%
                </span>
            </div>

            <!-- Slider -->
            <div class="mb-8 relative px-2">
                <input type="range" id="guess-slider" min="0" max="100" value="50" oninput="updateSliderValue()">
                <div class="flex justify-between text-xs font-black text-slate-400 mt-5 px-1 uppercase tracking-wider">
                    <span>0%</span>
                    <span>50%</span>
                    <span>100%</span>
                </div>
            </div>

            <!-- Submit Button -->
            <button id="confirm-btn" onclick="confirmGuess()" class="w-full bg-white text-slate-900 hover:bg-slate-100 font-black py-4 rounded-2xl text-xl shadow-[0_0_20px_rgba(255,255,255,0.3)] transition-all active:scale-95 mt-auto border-2 border-transparent">
                Submit Guess
            </button>

            <!-- Feedback Area (Hidden initially) -->
            <div id="feedback-area" class="hidden absolute bottom-0 left-0 w-full bg-slate-900/90 backdrop-blur-2xl rounded-t-[2.5rem] p-8 border-t border-white/20 slide-up shadow-[0_-20px_50px_rgba(0,0,0,0.5)]">
                
                <div class="flex justify-between items-end mb-4">
                    <span class="text-sm font-bold text-slate-400 uppercase tracking-wider">Correct Answer:</span>
                    <span id="correct-answer-display" class="text-4xl font-black text-emerald-400 drop-shadow-[0_0_15px_rgba(52,211,153,0.5)]">75%</span>
                </div>
                
                <div class="flex justify-between items-end mb-6">
                    <span class="text-sm font-bold text-slate-400 uppercase tracking-wider">Your Guess:</span>
                    <span id="user-guess-display" class="text-2xl font-black text-white">50%</span>
                </div>

                <div class="w-full h-px bg-white/10 mb-6"></div>

                <div class="flex justify-between items-center mb-6">
                    <span class="text-sm font-bold text-slate-300 uppercase tracking-wider">Points Earned:</span>
                    <span id="points-earned-display" class="text-5xl font-black text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-pink-400">+0</span>
                </div>

                <button id="next-btn" onclick="nextQuestion()" class="w-full bg-gradient-to-r from-indigo-500 to-purple-500 hover:from-indigo-400 hover:to-purple-400 text-white font-black py-4 rounded-2xl transition-all active:scale-95 text-lg shadow-lg border border-white/20">
                    Next Question ➔
                </button>
            </div>
        </div>
    </div>

    <!-- END SCREEN -->
    <div id="end-screen" class="hidden glass-panel max-w-md w-full rounded-[2.5rem] p-10 text-center pop-in relative z-10">
        <div class="text-7xl mb-6 drop-shadow-xl">🏆</div>
        <h2 class="text-4xl font-black text-white mb-2">Game Over!</h2>
        <p class="text-slate-300 mb-10 font-semibold">You've completed all 5 questions.</p>
        
        <div class="bg-black/30 border border-white/10 rounded-3xl p-8 mb-10 shadow-inner">
            <span class="text-xs font-bold text-pink-300 uppercase tracking-widest block mb-4">Final Score</span>
            <span id="final-score-display" class="text-8xl font-black text-transparent bg-clip-text bg-gradient-to-br from-white via-pink-200 to-purple-300 drop-shadow-lg">0</span>
            <span class="text-2xl text-slate-400 font-black">/ 500</span>
        </div>

        <button onclick="returnToMenu()" class="w-full bg-white/10 hover:bg-white/20 text-white font-black py-5 rounded-2xl text-xl shadow-lg border border-white/20 transition-all active:scale-95 backdrop-blur-md">
            Back to Menu
        </button>
    </div>

    <!-- Game Logic -->
    <script>
        // Centralized English Database
        const gameDatabase = [
            {
                id: 0,
                label: "Today",
                questions: [
                    { text: "What percentage of the Earth's surface is covered by water?", answer: 71 },
                    { text: "What percentage of the air we breathe is oxygen?", answer: 21 },
                    { text: "What percentage of an adult human brain is water?", answer: 73 },
                    { text: "What percentage of animal species in the world are invertebrates?", answer: 97 },
                    { text: "What percentage of the world's population is left-handed?", answer: 10 }
                ]
            },
            {
                id: 1,
                label: "Yesterday",
                questions: [
                    { text: "Percentage of people named Felipe who want to study aerospace engineering", answer: 1 },
                    { text: "What percentage of Earth's water is fresh water (not salty)?", answer: 3 },
                    { text: "What percentage of human DNA is identical to a chimpanzee's?", answer: 98 },
                    { text: "What percentage of global oceans has been accurately mapped?", answer: 20 },
                    { text: "What percentage of all humans who have ever lived are alive today?", answer: 7 }
                ]
            },
            {
                id: 2,
                label: "2 Days Ago",
                questions: [
                    { text: "What percentage of a standard cucumber is composed of water?", answer: 96 },
                    { text: "What percentage of the world's population has blue eyes?", answer: 8 },
                    { text: "What percentage of an atom is empty space?", answer: 99 },
                    { text: "What percentage of the solar system's mass belongs to the Sun?", answer: 99 },
                    { text: "What percentage of global plastic waste is effectively recycled?", answer: 9 }
                ]
            },
            {
                id: 3,
                label: "3 Days Ago",
                questions: [
                    { text: "What percentage of the Sahara Desert's surface is covered by sand?", answer: 20 },
                    { text: "What percentage of people dream exclusively in black and white?", answer: 12 },
                    { text: "What percentage of our daily calories does the human brain consume?", answer: 20 },
                    { text: "What percentage of the universe is made of dark matter and dark energy?", answer: 95 },
                    { text: "What percentage of mammal species can fly (like bats)?", answer: 20 }
                ]
            },
            {
                id: 4,
                label: "4 Days Ago",
                questions: [
                    { text: "What percentage of our lifetime do we spend sleeping on average?", answer: 33 },
                    { text: "What percentage of Mars' atmosphere is composed of carbon dioxide?", answer: 95 },
                    { text: "What percentage of a jellyfish's body is water?", answer: 95 },
                    { text: "What percentage of the current global population uses the internet?", answer: 67 },
                    { text: "What percentage of pure gold is in an 18-karat jewelry piece?", answer: 75 }
                ]
            },
            {
                id: 5,
                label: "5 Days Ago",
                questions: [
                    { text: "What percentage of the world's freshwater is frozen in Antarctica?", answer: 68 },
                    { text: "What percentage of languages spoken today are at risk of extinction?", answer: 40 },
                    { text: "What percentage of communication is considered non-verbal?", answer: 93 },
                    { text: "What percentage of the human body is made of carbon?", answer: 18 },
                    { text: "What percentage of the world's forests are located in Russia?", answer: 20 }
                ]
            }
        ];

        // State Variables
        let activeQuestions = [];
        let currentRound = 0;
        let totalScore = 0;

        // DOM Elements
        const startScreen = document.getElementById('start-screen');
        const gameScreen = document.getElementById('game-screen');
        const endScreen = document.getElementById('end-screen');
        
        const slider = document.getElementById('guess-slider');
        const sliderDisplay = document.getElementById('slider-value-display');
        const questionText = document.getElementById('question-text');
        const roundIndicator = document.getElementById('round-indicator');
        const scoreIndicator = document.getElementById('score-indicator');
        const gameTitleDisplay = document.getElementById('game-title-display');
        const confirmBtn = document.getElementById('confirm-btn');
        const feedbackArea = document.getElementById('feedback-area');
        
        // Update slider value in real time
        function updateSliderValue() {
            sliderDisplay.innerText = slider.value + "%";
        }

        // Hide all major screens
        function hideAllScreens() {
            startScreen.classList.add('hidden');
            gameScreen.classList.add('hidden');
            endScreen.classList.add('hidden');
        }

        // Return to Main Menu
        function returnToMenu() {
            hideAllScreens();
            startScreen.classList.remove('hidden');
            // Re-trigger animation
            startScreen.classList.remove('pop-in');
            void startScreen.offsetWidth;
            startScreen.classList.add('pop-in');
        }

        // Start a specific game
        function startGame(gameId) {
            const selectedGame = gameDatabase.find(g => g.id === gameId);
            activeQuestions = selectedGame.questions;
            gameTitleDisplay.innerText = selectedGame.label;

            currentRound = 0;
            totalScore = 0;
            updateScoreDisplay();
            
            hideAllScreens();
            gameScreen.classList.remove('hidden');
            gameScreen.classList.remove('fade-in');
            void gameScreen.offsetWidth;
            gameScreen.classList.add('fade-in');
            
            loadQuestion();
        }

        // Load the current question
        function loadQuestion() {
            const q = activeQuestions[currentRound];
            
            // Reset UI for new question
            slider.disabled = false;
            slider.value = 50;
            updateSliderValue();
            
            confirmBtn.classList.remove('hidden');
            feedbackArea.classList.add('hidden');
            feedbackArea.classList.remove('slide-up');
            
            questionText.innerText = q.text;
            roundIndicator.innerText = `${currentRound + 1}/5`;
        }

        // Submit guess and calculate score
        function confirmGuess() {
            slider.disabled = true; // Lock slider
            confirmBtn.classList.add('hidden'); // Hide submit button

            const userGuess = parseInt(slider.value);
            const q = activeQuestions[currentRound];
            const correctAnswer = q.answer;
            
            // Calculate Score: 100 - absolute difference
            const difference = Math.abs(correctAnswer - userGuess);
            let pointsEarned = 100 - difference;
            if (pointsEarned < 0) pointsEarned = 0; // Fallback, though max diff is 100 anyway

            // Update Total
            totalScore += pointsEarned;
            
            // Populate Feedback UI
            document.getElementById('correct-answer-display').innerText = correctAnswer + "%";
            document.getElementById('user-guess-display').innerText = userGuess + "%";
            
            const pointsDisplay = document.getElementById('points-earned-display');
            
            if (pointsEarned === 100) {
                pointsDisplay.innerText = "+100 (Perfect!)";
                pointsDisplay.className = "text-5xl font-black text-transparent bg-clip-text bg-gradient-to-r from-emerald-300 to-green-400 drop-shadow-[0_0_10px_rgba(52,211,153,0.5)]";
            } else {
                pointsDisplay.innerText = "+" + pointsEarned;
                pointsDisplay.className = "text-5xl font-black text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-pink-400";
            }

            // Animate Score Update at top right
            updateScoreDisplay();
            scoreIndicator.classList.remove('pop-in');
            void scoreIndicator.offsetWidth;
            scoreIndicator.classList.add('pop-in');

            // Show Feedback Panel
            feedbackArea.classList.remove('hidden');
            void feedbackArea.offsetWidth; 
            feedbackArea.classList.add('slide-up');
        }

        // Go to next round or end game
        function nextQuestion() {
            currentRound++;
            if (currentRound < activeQuestions.length) {
                loadQuestion();
            } else {
                showEndScreen();
            }
        }

        // Display the End Game screen
        function showEndScreen() {
            hideAllScreens();
            endScreen.classList.remove('hidden');
            
            endScreen.classList.remove('pop-in');
            void endScreen.offsetWidth;
            endScreen.classList.add('pop-in');
            
            // Animate final score counting up (optional polish, simplified here for reliability)
            document.getElementById('final-score-display').innerText = totalScore;
        }

        // Update the top right score display
        function updateScoreDisplay() {
            scoreIndicator.innerText = totalScore;
        }
    </script>
</body>
</html>
